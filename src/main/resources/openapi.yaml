openapi: 3.0.1
info:
  title: Loan Management API
  version: 1.0.0
paths:
  /loans:
    get:
      summary: Get all loans
      responses:
        '200':
          description: Successful operation
    post:
      summary: Create a new loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Loan'
      responses:
        '201':
          description: Loan created
  /loans/{id}:
    get:
      summary: Get loan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
    put:
      summary: Update loan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Loan'
      responses:
        '200':
          description: Loan updated
    delete:
      summary: Delete loan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Loan deleted
components:
  schemas:
    Loan:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        term:
          type: integer
          format: int32
        interestRate:
          type: number
          format: double
        status:
          type: string